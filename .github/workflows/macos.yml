name: macOS build

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: macOS Apple silicon release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -vV
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy including test targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the full test suite
        run: cargo test --locked

      - name: Run release rendering and stroke benchmarks
        run: cargo test --release --locked benchmark -- --ignored --nocapture

      - name: Build and verify the signed release app
        run: |
          ./scripts/bundle-macos.sh
          lipo dist/Lime.app/Contents/MacOS/lime -verify_arch arm64

      - name: Test the bundled headless PDF worker
        run: python3 scripts/check-pdf-worker.py --binary dist/Lime.app/Contents/MacOS/lime

      - name: Archive the app preserving bundle metadata
        run: ditto -c -k --sequesterRsrc --keepParent dist/Lime.app dist/Lime-macos-arm64-app.zip

      - name: Upload the macOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lime-macos-arm64-${{ github.sha }}
          path: dist/Lime-macos-arm64-app.zip
          if-no-files-found: error
          retention-days: 30
