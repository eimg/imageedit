name: Linux build

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Linux / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config python3 \
            libfontconfig1-dev libfreetype-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -vV

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy including test targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the full test suite
        run: cargo test --locked

      - name: Build the release executable
        run: cargo build --release --locked

      - name: Test the real headless PDF worker
        run: python3 scripts/check-pdf-worker.py --binary target/release/lime

      - name: Package portable downloads and checksums
        run: ./scripts/package-linux.sh --no-build

      - name: Upload Linux downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lime-linux-${{ matrix.arch }}
          path: |
            dist/Lime-*-linux-${{ matrix.arch }}
            dist/Lime-*-linux-${{ matrix.arch }}.tar.gz
            dist/Lime-*-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 30
