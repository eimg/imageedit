[package]
name = "lime"
version = "1.2.0"
edition = "2024"
description = "Lime — Lite Image Editor"
repository = "https://github.com/eimg/lime"

[dependencies]
anyhow = "1"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "sys-locale"] }
futures = "0.3"
flate2 = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
hayro = "0.9"
libc = "0.2"
moxcms = "=0.8.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pdf-writer = "0.15"
resvg = { version = "0.45", default-features = false }
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-segmentation = "1.13.3"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSCursor", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSArray", "NSEnumerator", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
muda = { version = "0.20", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"
