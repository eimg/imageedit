[package]
name = "lime"
version = "0.1.0"
edition = "2024"
description = "Lime — Lite Image Editor"
repository = "https://github.com/eimg/lime"

[dependencies]
anyhow = "1"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "sys-locale"] }
futures = "0.3"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSCursor", "NSImage", "NSResponder", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "std"] }
